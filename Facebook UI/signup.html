<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Facebook - Sign Up</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="signup-page">

        <div class="signup-box">

            <img
                src="./assets/images (1).jpeg"
                alt="Facebook Logo"
                class="signup-logo"
            >

            <h1>Create a new account</h1>

            <p class="signup-subtitle">
                It's quick and easy.
            </p>


            <div class="signup-line"></div>


            <form action="login.html">

                <div class="name-inputs">

                    <input
                        type="text"
                        placeholder="First name"
                        required
                    >

                    <input
                        type="text"
                        placeholder="Surname"
                        required
                    >

                </div>


                <label class="input-label">
                    Date of birth
                </label>


                <div class="date-inputs">

                    <select>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                        <option>6</option>
                        <option>7</option>
                        <option>8</option>
                        <option>9</option>
                        <option>10</option>
                        <option>11</option>
                        <option>12</option>
                        <option>13</option>
                        <option>14</option>
                        <option>15</option>
                        <option>16</option>
                        <option>17</option>
                        <option>18</option>
                        <option>19</option>
                        <option>20</option>
                        <option>21</option>
                        <option>22</option>
                        <option>23</option>
                        <option>24</option>
                        <option>25</option>
                        <option>26</option>
                        <option>27</option>
                        <option>28</option>
                        <option>29</option>
                        <option>30</option>
                        <option>31</option>
                    </select>


                    <select>

                        <option>January</option>
                        <option>February</option>
                        <option>March</option>
                        <option>April</option>
                        <option>May</option>
                        <option>June</option>
                        <option>July</option>
                        <option>August</option>
                        <option>September</option>
                        <option>October</option>
                        <option>November</option>
                        <option>December</option>

                    </select>


                    <select>

                        <option>2000</option>
                        <option>2001</option>
                        <option>2002</option>
                        <option>2003</option>
                        <option>2004</option>
                        <option>2005</option>
                        <option>2006</option>
                        <option>2007</option>
                        <option>2008</option>
                        <option>2009</option>

                    </select>

                </div>


                <label class="input-label">
                    Gender
                </label>


                <div class="gender-inputs">

                    <label>
                        Female
                        <input type="radio" name="gender">
                    </label>

                    <label>
                        Male
                        <input type="radio" name="gender">
                    </label>

                    <label>
                        Custom
                        <input type="radio" name="gender">
                    </label>

                </div>


                <input
                    type="email"
                    placeholder="Mobile number or email address"
                    required
                >


                <input
                    type="password"
                    placeholder="New password"
                    required
                >


                <p class="terms">

                    People who use our service may have
                    uploaded your contact information to Facebook.

                    <br><br>

                    By clicking Sign Up, you agree to our
                    Terms, Privacy Policy and Cookies Policy.

                </p>


                <button class="signup-button" type="submit">
                    Sign Up
                </button>

            </form>


            <a href="login.html" class="already-account">
                Already have an account?
            </a>

        </div>

    </div>

</body>

</html>
